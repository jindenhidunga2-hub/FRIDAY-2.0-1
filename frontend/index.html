<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050b14">

    <title>FRIDAY AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>FRIDAY</h1>
        <p>PERSONAL AI ASSISTANT</p>
    </header>


    <!-- AI CORE -->
    <div class="core">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="center"></div>
    </div>

    <p class="core-text" id="core-status">
        SYSTEM CHECKING...
    </p>


    <!-- SYSTEM DIAGNOSTICS -->
    <div class="status">

        <h2>SYSTEM DIAGNOSTICS</h2>

        <div class="row">
            <span>AI ENGINE</span>
            <b id="diag-ai" class="warning">
                ● CHECKING
            </b>
        </div>

        <div class="row">
            <span>CONNECTION</span>
            <b id="diag-connection" class="warning">
                ● CHECKING
            </b>
        </div>

        <div class="row">
            <span>VOICE INTERFACE</span>
            <b id="diag-voice" class="warning">
                ● CHECKING
            </b>
        </div>

        <div class="row">
            <span>LONG-TERM MEMORY</span>
            <b id="diag-memory" class="warning">
                ● CHECKING
            </b>
        </div>

    </div>


    <!-- CHAT -->
    <div
        class="chat"
        id="chat"
        aria-live="polite"
    ></div>


    <!-- INPUT AREA -->
    <div class="input-area">

        <input
            id="msg"
            type="text"
            placeholder="Enter a command for FRIDAY..."
            autocomplete="off"
        >

        <button
            id="send"
            type="button"
        >
            EXECUTE
        </button>

        <button
            id="mic-btn"
            type="button"
            aria-label="Activate voice input"
        >
            🎙️
        </button>

        <button
            id="cam-btn"
            type="button"
            aria-label="Analyze image"
        >
            📷
        </button>

        <button
            id="clear-btn"
            type="button"
        >
            CLEAR MEMORY
        </button>

        <input
            id="img-input"
            type="file"
            accept="image/*"
            style="display: none;"
        >

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
